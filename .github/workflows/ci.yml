name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+psycopg://golfiq_user:golfiq_password@localhost:5432/golfiq_test
  TEST_DATABASE_URL: postgresql+psycopg://golfiq_user:golfiq_password@localhost:5432/golfiq_test
  SECRET_KEY: ci-only-secret-key-not-for-production
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  LOG_LEVEL: INFO

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: golfiq_test
          POSTGRES_USER: golfiq_user
          POSTGRES_PASSWORD: golfiq_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U golfiq_user -d golfiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: golfiq_password
        run: pg_isready -h localhost -p 5432 -U golfiq_user -d golfiq_test

      - name: Compile application
        run: python -m compileall app

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Verify migration head
        run: python -m alembic current --check-heads

      - name: Run tests
        run: python -m pytest --cache-clear
